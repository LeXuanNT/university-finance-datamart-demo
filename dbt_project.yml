name: uni_finance
version: "1.0.0"
config-version: 2
profile: uni_finance
require-dbt-version: [">=1.9.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

vars:
  snapshot_date: "2026-10-31"      # month-end close being reported; override: --vars '{snapshot_date: 2026-11-30}'
  raw_sis_schema: raw_sis
  raw_workday_schema: raw_workday

models:
  uni_finance:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      # not for end users: views in their own schema, never queried by a BI tool or the app
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      finance:
        +schema: finance
      reporting:
        +schema: reporting
      statements:
        +schema: statements
    audit:
      +materialized: table
      +schema: audit

seeds:
  uni_finance:
    +schema: reference

snapshots:
  uni_finance:
    +schema: snapshots

data_tests:
  uni_finance:
    +severity: error

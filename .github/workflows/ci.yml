name: dbt build (DuckDB)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Land raw files (all VARCHAR)
        run: python scripts/load_raw_local.py
      - name: dbt build (models, seeds, snapshots, tests)
        run: dbt build --profiles-dir . --target local
      - name: Incremental re-run (idempotency check)
        run: dbt build --profiles-dir . --target local --select fct_student_payments+ fct_gl_actuals+
      - name: SCD Type 2 demo (next month's master-data extract)
        run: |
          python scripts/simulate_change.py
          dbt snapshot --profiles-dir . --target local
          python - <<'PY'
          import duckdb
          con = duckdb.connect("uni_finance.duckdb", read_only=True)
          n = con.sql("select count(*) from snapshots.snap_program_fees where dbt_valid_to < '9999-01-01'").fetchone()[0]
          assert n == 3, f"expected 3 closed fee versions, got {n}"
          print(f"SCD2 OK: {n} program fee versions closed")
          PY
      - name: Source freshness
        run: dbt source freshness --profiles-dir . --target local
      - name: Data-quality evidence
        run: |
          python - <<'PY'
          import duckdb
          con = duckdb.connect("uni_finance.duckdb", read_only=True)
          rows = con.sql("select issue, rows_affected, action from audit.audit_data_quality").fetchall()
          with open("dq.md", "w") as f:
              f.write("| Issue | Rows | Action |\n|---|---:|---|\n")
              for r in rows:
                  f.write(f"| {r[0]} | {r[1]:,} | {r[2]} |\n")
          PY
          cat dq.md >> "$GITHUB_STEP_SUMMARY"

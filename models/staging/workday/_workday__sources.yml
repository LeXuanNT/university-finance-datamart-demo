version: 2
sources:
  - name: workday
    description: >
      Workday Financials extracts: cost centres, journal lines (actuals) and the approved budget.
      Landed as-is, every column VARCHAR, plus _source_file / _loaded_at.
    schema: "{{ var('raw_workday_schema') }}"
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 2, period: day}
    tables:
      - name: cost_centres
      - name: journal_lines
      - name: budget
